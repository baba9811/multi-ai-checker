name: Release to Chrome Web Store
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: chrome-web-store
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/ci.yml
  upload:
    needs: validate
    permissions:
      contents: read
      id-token: write
    uses: baba9811/multi-ai-checker/.github/workflows/store-upload.yml@main

name: Validate extension
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: python3 -m unittest discover -s tests/release -v
      - name: Browser UI and DOM fixtures
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log(chromium.executablePath())')"
          npm run test:e2e
      - name: Unpacked MV3 extension in clean Chromium
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log(chromium.executablePath())')"
          npm run test:e2e:extension
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: crosscheck-release-package
          path: .output/*-chrome.zip
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crosscheck-build-and-tests
          path: |
            .output/*-chrome.zip
            test-results/
            playwright-report/

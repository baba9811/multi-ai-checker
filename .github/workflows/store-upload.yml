name: Trusted Chrome Web Store upload
on:
  workflow_call:
permissions:
  contents: read
jobs:
  upload:
    if: github.event_name == 'release' && github.event.action == 'published' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          [[ "$release_sha" == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$release_sha" HEAD
          git show "$release_sha:package.json" | python3 -c 'import json,os,sys; assert "v" + json.load(sys.stdin)["version"] == os.environ["RELEASE_TAG"], "Package version must match tag"'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crosscheck-release-package
          path: release-package
      - name: Validate exact artifact and configuration
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          CWS_SUBMIT: ${{ vars.CWS_SUBMIT }}
        run: |
          test -n "$CWS_PUBLISHER_ID" && test -n "$CWS_EXTENSION_ID"
          test -n "$WIF_PROVIDER" && test -n "$SERVICE_ACCOUNT"
          [[ "$CWS_SUBMIT" == "true" || "$CWS_SUBMIT" == "false" ]]
          shopt -s nullglob
          packages=(release-package/*-chrome.zip)
          [[ ${#packages[@]} == 1 ]]
          python3 scripts/release/webstore.py "${packages[0]}" "${RELEASE_TAG#v}" --check
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload validated ZIP; optionally submit for review
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_SUBMIT: ${{ vars.CWS_SUBMIT }}
        run: |
          packages=(release-package/*-chrome.zip)
          options=()
          if [[ "$CWS_SUBMIT" == "true" ]]; then options+=(--submit); fi
          python3 scripts/release/webstore.py "${packages[0]}" "${RELEASE_TAG#v}" "${options[@]}"
